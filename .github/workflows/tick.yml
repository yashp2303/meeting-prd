name: pipeline tick

# Vercel's Hobby plan limits Cron to one run per day, which is far too slow for
# a pipeline that has to catch a meeting starting and poll its transcript. This
# workflow is the real driver: GitHub Actions schedules are free at 5-minute
# granularity. Delete this file if you upgrade to Vercel Pro and rely on
# vercel.json's crons block instead.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the pipeline
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Until the app is deployed there is nothing to ping. Skip quietly
          # rather than failing: this runs every 5 minutes, and a red cross on
          # every run trains you to ignore the one that actually matters.
          if [ -z "$APP_BASE_URL" ]; then
            echo "::notice::APP_BASE_URL is not set — skipping. Add it under Settings > Secrets and variables > Actions once the app is deployed."
            exit 0
          fi

          # `bash -e` would abort on curl's exit status before the HTTP code is
          # ever inspected, turning "host unreachable" into a bare exit 6.
          # Capture the status instead and report something legible.
          set +e
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 \
            "$APP_BASE_URL/api/cron/tick" 2>&1)
          curl_status=$?
          set -e

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          if [ "$curl_status" -ne 0 ]; then
            echo "$body"
            case "$curl_status" in
              6)  echo "::error::Could not resolve $APP_BASE_URL — the host no longer exists. If this was a temporary tunnel it has expired; update the APP_BASE_URL secret." ;;
              7)  echo "::error::Connection refused by $APP_BASE_URL — the app is not listening." ;;
              28) echo "::error::Timed out after 300s pinging $APP_BASE_URL." ;;
              *)  echo "::error::curl failed with status $curl_status pinging $APP_BASE_URL." ;;
            esac
            exit 1
          fi

          echo "$body"
          echo "HTTP $code"

          if [ "$code" != "200" ]; then
            echo "::error::Tick returned HTTP $code"
            exit 1
          fi
